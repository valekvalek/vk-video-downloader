name: Unpack scaffold
on:
  push:
    paths: ["scaffold.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unpack
        run: |
          test -f scaffold.zip
          unzip -o scaffold.zip
          rm scaffold.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add matchlens package structure (pipeline core, tests, docs)"
          git push
