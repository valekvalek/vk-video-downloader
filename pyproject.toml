[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlens"
version = "0.1.0"
description = "Анализ футбольного матча по видео: игроки по номерам, ошибки, план улучшений"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
download = ["yt-dlp"]
vision = ["ultralytics", "opencv-python-headless"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
matchlens = "matchlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
